[package]
name = "walz-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"
description = "Walz compiler for the browser playground"
repository = "https://github.com/mizchi/walz-lang"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
walz = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
