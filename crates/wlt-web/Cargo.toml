[package]
name = "wlt-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0 WITH LLVM-exception"
description = "WLT compiler for the browser playground"
repository = "https://github.com/mizchi/wlt-lang"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wlt = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
