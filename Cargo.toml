[package]
name = "wlt"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "A small typed language extending WAT for Wasm GC"
repository = "https://github.com/mizchi/wlt-lang"
readme = "README.md"
license = "Apache-2.0 WITH LLVM-exception"

[workspace]
members = [".", "crates/wlt-web"]
default-members = ["."]

[[bench]]
name = "frontend"
harness = false

[[example]]
name = "stdlib-docs"
path = "tools/stdlib-docs.rs"

[[example]]
name = "json-bench"
path = "tools/json-bench.rs"

[[example]]
name = "bench-capture"
path = "tools/bench-capture.rs"

[dependencies]
wat = "=1.262.0"
wast = "=262.0.0"
wasmparser = "=0.262.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wit-parser = "=0.262.0"

[build-dependencies]
wast = "=262.0.0"

[profile.dev]
debug = 0

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "html_reports"] }
