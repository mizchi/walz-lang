[package]
name = "gcwat"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0 WITH LLVM-exception"

[workspace]

[dependencies]
wat = "=1.262.0"
wasmparser = "=0.262.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.dev]
debug = 0
