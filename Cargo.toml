[package]
name = "wlt"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "A small typed language extending WAT for Wasm GC"
repository = "https://github.com/mizchi/wlt-lang"
readme = "README.md"
license = "Apache-2.0 WITH LLVM-exception"

[workspace]

[[example]]
name = "stdlib-docs"
path = "tools/stdlib-docs.rs"

[dependencies]
wat = "=1.262.0"
wast = "=262.0.0"
wasmparser = "=0.262.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wit-parser = "=0.262.0"

[profile.dev]
debug = 0
