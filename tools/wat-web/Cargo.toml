[package]
name = "walz-wat-web-reference"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"
description = "Browser-size benchmark fixture: WAT parser and Wasm validator"

# Benchmark fixture, deliberately separate from the production workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wat = "=1.262.0"
wasmparser = "=0.262.0"
wasm-bindgen = "=0.2.130"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
