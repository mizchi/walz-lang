name: Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.99.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            target/release
            target/wasm32-unknown-unknown/release
          key: pages-${{ runner.os }}-rust-1.99-wasm-pack-0.15-${{ hashFiles('Cargo.lock') }}
          restore-keys: pages-${{ runner.os }}-rust-1.99-wasm-pack-0.15-
      - name: Dependencies
        run: |
          pnpm install --frozen-lockfile
          if ! wasm-pack --version 2>/dev/null | grep -qx 'wasm-pack 0.15.0'; then
            cargo install wasm-pack --version 0.15.0 --locked --force
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/ci-tools
            ~/.elan
          key: tools-${{ runner.os }}-${{ hashFiles('ci/tools.json', 'ci/install-tools.py') }}
      - name: Native comparison tools
        run: python3 ci/install-tools.py
      - name: Build and check the browser compiler
        run: |
          pnpm playground:build
          node --test playground/samples.test.mjs playground/selfhost-compiler.test.mjs playground/worker-client.test.mjs
          cargo test --locked -p walz-web
      - name: Browser tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:playground
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/playground
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
