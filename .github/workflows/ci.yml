name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CI: true
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [compiler, runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: rust-${{ runner.os }}-1.99-${{ matrix.suite }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-1.99-${{ matrix.suite }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/ci-tools
            ~/.elan
          key: tools-${{ runner.os }}-${{ hashFiles('ci/tools.json', 'ci/install-tools.py') }}
      - name: Pinned tools
        run: python3 ci/install-tools.py
      - name: Compiler, contracts and language tests
        if: matrix.suite == 'compiler'
        run: |
          just check
          just test
          just test-language
          just proof-check
          just wit-check
          just test-install
      - name: Differential seeds
        if: matrix.suite == 'compiler'
        env:
          WLT_FUZZ_CASES: ${{ github.event_name == 'schedule' && '256' || '32' }}
        run: |
          for seed in 137 2026; do
            WLT_FUZZ_SEED="$seed" cargo test --locked --test differential
          done
      - name: Dependencies
        if: matrix.suite == 'runtime'
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.suite == 'runtime'
        with:
          path: target/content-mapper-tools/
          key: tsgo-${{ runner.os }}-${{ hashFiles('content-mapper/upstream.json', 'tools/build-content-mapper-tsgo.py') }}
      - name: JS and evaluation harnesses
        if: matrix.suite == 'runtime'
        run: |
          node --expose-gc --test --test-force-exit runtime/*.test.mjs
          just test-evals
          just test-content-mapper
          just test-content-mapper-tsgo
      - name: Browser
        if: matrix.suite == 'runtime'
        run: |
          pnpm exec playwright install --with-deps chromium
          just test-e2e
          just test-vite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-${{ matrix.suite }}
          path: |
            target/fuzz/failures/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
